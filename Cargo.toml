[workspace]
resolver = "2"
members = ["crates/bastion-domain", "crates/bastion-secrets", "crates/bastion-store", "crates/bastion-gateway", "crates/bastion-api", "crates/bastion-server"]
exclude = ["vendor/russh"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
ipnet = { version = "2", features = ["serde"] }
rpassword = "7"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "chrono", "uuid", "json", "migrate", "macros"] }
axum = "0.8"
base64 = "0.22"
bytes = "1"
libc = "0.2"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
rand = "0.8"
rand10 = { package = "rand", version = "0.10" }
russh = "=0.62.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["zeroize_derive"] }
bastion-domain = { path = "crates/bastion-domain" }
bastion-secrets = { path = "crates/bastion-secrets" }
bastion-store = { path = "crates/bastion-store" }
bastion-gateway = { path = "crates/bastion-gateway" }
bastion-api = { path = "crates/bastion-api" }

[patch.crates-io]
# Snapshot of ZeroTerm's patched 0.62.4, plus the server reply corrections
# documented in vendor/russh/BASTION-PATCH.md. No sibling checkout required.
russh = { path = "vendor/russh" }
