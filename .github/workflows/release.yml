name: Build and push images
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Image names must be lowercase; compose.yaml pulls ghcr.io/notpeppa/zeroterm-terminal[-guacd].
      - name: Image names
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "APP=$image" >> "$GITHUB_ENV"
          echo "GUACD=$image-guacd" >> "$GITHUB_ENV"
          echo "SHA=${GITHUB_SHA::12}" >> "$GITHUB_ENV"
      # The layer cache keeps the FreeRDP/guacamole compile from rerunning when deploy/guacd is unchanged.
      - name: Build and push guacd engine
        run: |
          docker buildx build --push -f deploy/guacd/Dockerfile \
            --cache-from type=gha,scope=guacd --cache-to type=gha,mode=max,scope=guacd \
            -t "$GUACD:1.6.0-strict-pin" -t "$GUACD:latest" -t "$GUACD:sha-$SHA" .
      - name: Build and push bastion app
        run: |
          docker buildx build --push \
            --cache-from type=gha,scope=app --cache-to type=gha,mode=max,scope=app \
            -t "$APP:latest" -t "$APP:sha-$SHA" .
