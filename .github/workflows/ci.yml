name: Browser-only RFC005
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_PASSWORD: isolated-ci-postgres-only
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - name: Execute all six opt-in PostgreSQL suites on fresh isolated databases
        run: |
          umask 077
          printf '%s' 'postgres://postgres:isolated-ci-postgres-only@127.0.0.1:5432/postgres' > "$RUNNER_TEMP/guac-pg-url"
          python3 tests/pg_acceptance.py --database-url-file "$RUNNER_TEMP/guac-pg-url"
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
  guacd-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ENGINE_PROJECT: zt-guac-v2-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned engine, compile strict callback, run leaf digest unit
        run: docker build --progress plain -t zeroterm-guacd:1.6.0-strict-pin -f deploy/guacd/Dockerfile .
      - name: Real isolated OpenSSH xrdp-TLS VNC strict pin and redirect-PDU probes
        run: sudo python3 -u tests/docker_guacd_acceptance.py --project "$ENGINE_PROJECT" --directory "/var/tmp/$ENGINE_PROJECT"
      - name: Fresh family-2 HTTPS deployment and recording-permission degradation
        run: |
          docker build --progress plain -t "$ENGINE_PROJECT:app" .
          sudo python3 -u tests/docker_smoke.py --image "$ENGINE_PROJECT:app"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install isolated, pinned browser test tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/guac-playwright" --no-save --ignore-scripts --no-audit --no-fund playwright@1.61.1
          "$RUNNER_TEMP/guac-playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Real browser SSH password/key, xrdp-TLS, VNC none/password, replay and required recording faults
        env:
          PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/guac-playwright/node_modules/playwright
        run: |
          sudo python3 -u tests/docker_browser_fixture.py start --directory "/var/tmp/$ENGINE_PROJECT-browser" \
            --app-image "$ENGINE_PROJECT:app" --engine-image zeroterm-guacd:1.6.0-strict-pin --target-image "$ENGINE_PROJECT:fixture"
          sudo install -m 0600 -o "$USER" "/var/tmp/$ENGINE_PROJECT-browser/browser-fixture.json" "$RUNNER_TEMP/guac-browser-fixture.json"
          node tests/browser_e2e.mjs "$RUNNER_TEMP/guac-browser-fixture.json" "$RUNNER_TEMP/guacd-evidence/browser"
          node tests/browser_groups.mjs "$RUNNER_TEMP/guac-browser-fixture.json" "$RUNNER_TEMP/guacd-evidence/groups"
          sudo env "PLAYWRIGHT_PACKAGE=$PLAYWRIGHT_PACKAGE" "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" \
            node tests/browser_clipboard.mjs "$RUNNER_TEMP/guac-browser-fixture.json" "$RUNNER_TEMP/guacd-evidence/clipboard"
      - name: Remove only this run's browser fixture and egress rules
        if: always()
        run: |
          if sudo test -f "/var/tmp/$ENGINE_PROJECT-browser/browser-fixture.json"; then
            sudo python3 tests/docker_browser_fixture.py stop --directory "/var/tmp/$ENGINE_PROJECT-browser"
          fi
      - name: Compile the test-only recording syscall fault shim
        run: |
          sudo mkdir -m 0700 "/var/tmp/$ENGINE_PROJECT-fault"
          sudo cp tests/guacd-fixture/recording-fault.c "/var/tmp/$ENGINE_PROJECT-fault/"
          docker run --rm --network none --memory 128m --memory-swap 256m \
            -v "/var/tmp/$ENGINE_PROJECT-fault:/work" --entrypoint cc rust:1.95-bookworm \
            -shared -fPIC -std=c11 -Wall -Wextra -Werror /work/recording-fault.c -o /work/recording-fault.so -ldl
      - name: Real cold restore, new-key-only replay, ten mixed sessions and recording syscall faults
        env:
          PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/guac-playwright/node_modules/playwright
        run: |
          sudo python3 -u tests/docker_browser_fixture.py start --directory "/var/tmp/$ENGINE_PROJECT-recovery" \
            --app-image "$ENGINE_PROJECT:app" --engine-image zeroterm-guacd:1.6.0-strict-pin --target-image "$ENGINE_PROJECT:fixture" \
            --recording-fault-library "/var/tmp/$ENGINE_PROJECT-fault/recording-fault.so"
          sudo install -m 0600 -o "$USER" "/var/tmp/$ENGINE_PROJECT-recovery/browser-fixture.json" "$RUNNER_TEMP/guac-recovery-fixture.json"
          sudo env "PLAYWRIGHT_PACKAGE=$PLAYWRIGHT_PACKAGE" "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" \
            node tests/browser_recovery.mjs "$RUNNER_TEMP/guac-recovery-fixture.json" "$RUNNER_TEMP/guacd-evidence/recovery" "/var/tmp/$ENGINE_PROJECT-recovery"
          sudo env "PLAYWRIGHT_PACKAGE=$PLAYWRIGHT_PACKAGE" "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" \
            node tests/browser_stall.mjs "$RUNNER_TEMP/guac-recovery-fixture.json" "$RUNNER_TEMP/guacd-evidence/stall" "/var/tmp/$ENGINE_PROJECT-recovery"
      - name: Remove only this run's recovery fixture and bounded recording mount
        if: always()
        run: |
          if sudo test -f "/var/tmp/$ENGINE_PROJECT-recovery/browser-fixture.json"; then
            sudo python3 tests/docker_browser_fixture.py stop --directory "/var/tmp/$ENGINE_PROJECT-recovery"
          fi
      - name: Copy only non-secret evidence out of root-owned fixture directories
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/guacd-evidence"
          for file in evidence.json engine-check.stdout engine-check.stderr ssh-auth.log xrdp-auth.log guacd-protocol.log redirect-peer.stdout redirect-peer.stderr; do
            if sudo test -f "/var/tmp/$ENGINE_PROJECT/$file"; then
              sudo install -m 0644 "/var/tmp/$ENGINE_PROJECT/$file" "$RUNNER_TEMP/guacd-evidence/$file"
            fi
          done
          sudo sh -c 'for file in /var/tmp/zt-guac-v2-*/deployment-evidence.json; do
            test ! -f "$file" || install -m 0644 "$file" "$1/deployment-evidence.json"
          done' sh "$RUNNER_TEMP/guacd-evidence"
      - name: Preserve candidate evidence (never production acceptance)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guacd-engine-evidence
          path: ${{ runner.temp }}/guacd-evidence/
