services:
  # One-shot: generates secrets on a fresh install, skips when already initialized.
  init:
    image: zeroterm-bastion:local
    restart: "no"
    network_mode: none
    entrypoint: ["sh", "/usr/local/share/zeroterm-bastion/docker-fresh-init.sh"]
    configs:
      - source: fresh_init
        target: /usr/local/share/zeroterm-bastion/docker-fresh-init.sh
    volumes:
      - secrets:/etc/zeroterm-bastion/secrets
      - database-auth:/run/bastion-db
      - runtime-auth:/run/bastion-runtime
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    networks: [app]
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: bastion
      POSTGRES_USER: bastion
      POSTGRES_PASSWORD_FILE: /run/bastion-db/password
    volumes:
      - database:/var/lib/postgresql/data
      - database-auth:/run/bastion-db:ro
      - runtime-auth:/run/bastion-runtime:ro
    configs:
      - source: runtime_role_setup
        target: /usr/local/share/zeroterm-bastion/docker-runtime-role.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bastion -d bastion"]
      interval: 5s
      timeout: 3s
      retries: 12
    stop_grace_period: 30s

  guacd:
    image: ${GUACD_IMAGE:?Set GUACD_IMAGE to ghcr.io/notpeppa/zeroterm-terminal-guacd:1.6.0-strict-pin or its sha256 digest}
    restart: unless-stopped
    # NEVER attach to app/default/target networks; no database/secrets/recordings mounts.
    networks:
      guac_bridge:
        ipv4_address: 172.30.61.3
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=0700,uid=10002,gid=10002"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Real ten-session mixed acceptance exceeded 128 threads/processes.
    pids_limit: 256

  bastion:
    image: zeroterm-bastion:local
    build:
      context: .
      args:
        CARGO_BUILD_JOBS: ${CARGO_BUILD_JOBS:-1}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      guacd:
        condition: service_started
      bootstrap-admin:
        condition: service_completed_successfully
    networks:
      app:
      ingress:
        ipv4_address: 172.30.63.2
      guac_bridge:
        ipv4_address: 172.30.61.2
    environment:
      BASTION_PASSWORD_MIN_LENGTH: ${BASTION_PASSWORD_MIN_LENGTH:-12}
    configs:
      - source: bastion_config
        target: /etc/zeroterm-bastion/production.toml
    volumes:
      - secrets:/etc/zeroterm-bastion/secrets:ro
      - runtime-auth:/run/bastion-runtime:ro
      - recordings:/var/lib/zeroterm-bastion/recordings
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "3", "http://172.30.63.2:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # One-shot: creates or upgrades the tables with the owner connection. The app never migrates itself
  # and never holds owner credentials; `bastion` starts only after this and grant-runtime succeed.
  migrate:
    image: zeroterm-bastion:local
    restart: "no"
    networks: [app]
    depends_on:
      postgres:
        condition: service_healthy
    command: ["migrate", "--config", "/etc/zeroterm-bastion/maintenance.toml"]
    configs:
      - source: bastion_maintenance_config
        target: /etc/zeroterm-bastion/maintenance.toml
    volumes:
      - secrets:/etc/zeroterm-bastion/secrets:ro
      - database-auth:/run/bastion-db:ro
      - runtime-auth:/run/bastion-runtime:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # One-shot: refreshes the runtime role's least-privilege grants after every migration. Needs psql,
  # so it uses the postgres image and reaches the server over the app network as the owner.
  grant-runtime:
    image: postgres:17-bookworm
    restart: "no"
    networks: [app]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: bastion
      PGHOST: postgres
      PGPASSFILE: /tmp/pgpass
    entrypoint: ["sh", "-c"]
    command:
      - |
        umask 077
        echo "postgres:5432:*:bastion:$$(cat /run/bastion-db/password)" > /tmp/pgpass
        sh /usr/local/share/zeroterm-bastion/docker-runtime-role.sh
    configs:
      - source: runtime_role_setup
        target: /usr/local/share/zeroterm-bastion/docker-runtime-role.sh
    volumes:
      - database-auth:/run/bastion-db:ro
      - runtime-auth:/run/bastion-runtime:ro
    # The owner-only secret files belong to UID 10001; read them as that UID instead of granting caps.
    user: "10001:10001"
    tmpfs: ["/tmp:size=1m,mode=0700,uid=10001,gid=10001"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # One-shot: creates the first administrator only if none exists, using the runtime role. Password from
  # BASTION_ADMIN_PASSWORD or BASTION_ADMIN_PASSWORD_FILE; if both are unset, one is generated and printed
  # once to this service's log. Once an administrator exists these settings are ignored.
  bootstrap-admin:
    image: zeroterm-bastion:local
    restart: "no"
    networks: [app]
    depends_on:
      grant-runtime:
        condition: service_completed_successfully
    command: ["ensure-admin", "--config", "/etc/zeroterm-bastion/production.toml", "--username", "${BASTION_ADMIN_USERNAME:-admin}"]
    environment:
      BASTION_ADMIN_PASSWORD: ${BASTION_ADMIN_PASSWORD:-}
      BASTION_ADMIN_PASSWORD_FILE: ${BASTION_ADMIN_PASSWORD_FILE:-}
      BASTION_PASSWORD_MIN_LENGTH: ${BASTION_PASSWORD_MIN_LENGTH:-12}
    configs:
      - source: bastion_config
        target: /etc/zeroterm-bastion/production.toml
    volumes:
      - secrets:/etc/zeroterm-bastion/secrets:ro
      - runtime-auth:/run/bastion-runtime:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  maintenance:
    profiles: [tools]
    image: zeroterm-bastion:local
    networks: [app]
    command: ["migrate", "--config", "/etc/zeroterm-bastion/maintenance.toml"]
    environment:
      BASTION_PASSWORD_MIN_LENGTH: ${BASTION_PASSWORD_MIN_LENGTH:-12}
    configs:
      - source: bastion_maintenance_config
        target: /etc/zeroterm-bastion/maintenance.toml
    volumes:
      - secrets:/etc/zeroterm-bastion/secrets
      - database-auth:/run/bastion-db
      - runtime-auth:/run/bastion-runtime
      - recordings:/var/lib/zeroterm-bastion/recordings
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  proxy:
    image: nginx:stable-alpine
    restart: unless-stopped
    networks:
      ingress:
        ipv4_address: 172.30.63.3
    ports:
      - "${BASTION_HTTPS_PORT:-443}:443"
    depends_on:
      bastion:
        condition: service_healthy
        restart: true
    configs:
      - source: nginx_config
        target: /etc/nginx/conf.d/default.conf
    volumes:
      - type: bind
        source: ./.local/docker/tls
        target: /etc/nginx/tls
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--insecure", "--max-time", "3", "https://127.0.0.1/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12

configs:
  bastion_config:
    file: ./.local/docker/production.toml
  bastion_maintenance_config:
    file: ./.local/docker/maintenance.toml
  nginx_config:
    file: ./.local/docker/nginx.conf
  runtime_role_setup:
    file: ./deploy/docker-runtime-role.sh
  fresh_init:
    file: ./deploy/docker-fresh-init.sh

networks:
  app:
    ipam:
      config:
        - subnet: 172.30.62.0/24
  guac_bridge:
    internal: true
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.30.61.0/29
  ingress:
    ipam:
      config:
        - subnet: 172.30.63.0/29

volumes:
  database:
  database-auth:
  runtime-auth:
  secrets:
  recordings:
