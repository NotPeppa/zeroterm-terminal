# Bounded container logs for the long-running services; Docker's default json-file driver never rotates.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  # One-shot: generates secrets on a fresh install, skips when already initialized.
  init:
    container_name: ${COMPOSE_PROJECT_NAME}-init
    image: ${BASTION_IMAGE:-ghcr.io/notpeppa/zeroterm-terminal:latest}
    restart: "no"
    network_mode: none
    entrypoint: ["sh", "/usr/local/share/zeroterm-bastion/docker-fresh-init.sh"]
    volumes:
      - secrets:/etc/zeroterm-bastion/secrets
      - database-auth:/run/bastion-db
      - runtime-auth:/run/bastion-runtime
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  postgres:
    container_name: ${COMPOSE_PROJECT_NAME}-postgres
    logging: *default-logging
    image: postgres:17-bookworm
    restart: unless-stopped
    networks: [app]
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: bastion
      POSTGRES_USER: bastion
      POSTGRES_PASSWORD_FILE: /run/bastion-db/password
    volumes:
      - database:/var/lib/postgresql/data
      - database-auth:/run/bastion-db:ro
      - runtime-auth:/run/bastion-runtime:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bastion -d bastion"]
      interval: 5s
      timeout: 3s
      retries: 12
    stop_grace_period: 30s

  # Owns guacd's network namespace and installs its egress rules inside it on every start: guacd may only
  # answer the app on 4822 and reach the app's per-session listener; host, targets and Internet are dropped.
  # The rules live and die with this container, so nothing has to be installed on the host.
  guacd-net:
    container_name: ${COMPOSE_PROJECT_NAME}-guacd-net
    logging: *default-logging
    image: ${GUACD_IMAGE:-ghcr.io/notpeppa/zeroterm-terminal-guacd:1.6.0-strict-pin}
    restart: unless-stopped
    # NEVER attach to app/default/target networks.
    networks:
      guac_bridge:
        ipv4_address: 172.30.61.3
    environment:
      ZT_APP_IP: 172.30.61.2
    user: "0:0"
    entrypoint: ["sh", "/usr/local/share/zeroterm-guacd/netns-guard.sh"]
    volumes:
      - guacd-netns:/run/zt-netns
    read_only: true
    tmpfs: ["/run:size=1m,mode=0755"]
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(cat /run/zt-netns/ready)\" = \"$$(readlink /proc/self/ns/net)\" && iptables -S OUTPUT | grep -qx -- '-P OUTPUT DROP'"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  guacd:
    container_name: ${COMPOSE_PROJECT_NAME}-guacd
    logging: *default-logging
    image: ${GUACD_IMAGE:-ghcr.io/notpeppa/zeroterm-terminal-guacd:1.6.0-strict-pin}
    restart: unless-stopped
    # Shares guacd-net's namespace and its rules; starts only once they are in place. No database/secrets/
    # recordings mounts, no capabilities, so it can neither change the rules nor leave the namespace.
    network_mode: service:guacd-net
    depends_on:
      guacd-net:
        condition: service_healthy
        restart: true
    entrypoint: ["/usr/local/share/zeroterm-guacd/wait-netns.sh"]
    command: ["-f", "-b", "0.0.0.0", "-l", "4822", "-L", "info"]
    volumes:
      - guacd-netns:/run/zt-netns:ro
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=0700,uid=10002,gid=10002"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Real ten-session mixed acceptance exceeded 128 threads/processes.
    pids_limit: 256

  bastion:
    container_name: ${COMPOSE_PROJECT_NAME}-bastion
    logging: *default-logging
    image: ${BASTION_IMAGE:-ghcr.io/notpeppa/zeroterm-terminal:latest}
    build:
      context: .
      args:
        CARGO_BUILD_JOBS: ${CARGO_BUILD_JOBS:-1}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      guacd:
        condition: service_started
      bootstrap-admin:
        condition: service_completed_successfully
    networks:
      app:
      ingress:
        ipv4_address: 172.30.63.2
      guac_bridge:
        ipv4_address: 172.30.61.2
    environment:
      BASTION_PASSWORD_MIN_LENGTH: ${BASTION_PASSWORD_MIN_LENGTH:-12}
    configs:
      - source: bastion_config
        target: /etc/zeroterm-bastion/production.toml
    volumes:
      - secrets:/etc/zeroterm-bastion/secrets:ro
      - runtime-auth:/run/bastion-runtime:ro
      - recordings:/var/lib/zeroterm-bastion/recordings
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "3", "http://172.30.63.2:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # One-shot: creates or upgrades the tables with the owner connection. The app never migrates itself
  # and never holds owner credentials; `bastion` starts only after this and grant-runtime succeed.
  migrate:
    container_name: ${COMPOSE_PROJECT_NAME}-migrate
    image: ${BASTION_IMAGE:-ghcr.io/notpeppa/zeroterm-terminal:latest}
    restart: "no"
    networks: [app]
    depends_on:
      postgres:
        condition: service_healthy
    command: ["migrate", "--config", "/etc/zeroterm-bastion/maintenance.toml"]
    configs:
      - source: bastion_maintenance_config
        target: /etc/zeroterm-bastion/maintenance.toml
    volumes:
      - secrets:/etc/zeroterm-bastion/secrets:ro
      - database-auth:/run/bastion-db:ro
      - runtime-auth:/run/bastion-runtime:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # One-shot: refreshes the runtime role's least-privilege grants after every migration. The app image
  # ships psql and the script; it reaches the server over the app network as the owner.
  grant-runtime:
    container_name: ${COMPOSE_PROJECT_NAME}-grant-runtime
    image: ${BASTION_IMAGE:-ghcr.io/notpeppa/zeroterm-terminal:latest}
    restart: "no"
    networks: [app]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: bastion
      PGHOST: postgres
      PGPASSFILE: /tmp/pgpass
    entrypoint: ["sh", "-c"]
    command:
      - |
        umask 077
        echo "postgres:5432:*:bastion:$$(cat /run/bastion-db/password)" > /tmp/pgpass
        sh /usr/local/share/zeroterm-bastion/docker-runtime-role.sh
    volumes:
      - database-auth:/run/bastion-db:ro
      - runtime-auth:/run/bastion-runtime:ro
    # The owner-only secret files belong to UID 10001; read them as that UID instead of granting caps.
    user: "10001:10001"
    tmpfs: ["/tmp:size=1m,mode=0700,uid=10001,gid=10001"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # One-shot: creates the first administrator only if none exists, using the runtime role. Password from
  # BASTION_ADMIN_PASSWORD or BASTION_ADMIN_PASSWORD_FILE; if both are unset, one is generated and printed
  # once to this service's log. Once an administrator exists these settings are ignored.
  bootstrap-admin:
    container_name: ${COMPOSE_PROJECT_NAME}-bootstrap-admin
    image: ${BASTION_IMAGE:-ghcr.io/notpeppa/zeroterm-terminal:latest}
    restart: "no"
    networks: [app]
    depends_on:
      grant-runtime:
        condition: service_completed_successfully
    command: ["ensure-admin", "--config", "/etc/zeroterm-bastion/production.toml", "--username", "${BASTION_ADMIN_USERNAME:-admin}"]
    environment:
      BASTION_ADMIN_PASSWORD: ${BASTION_ADMIN_PASSWORD:-}
      BASTION_ADMIN_PASSWORD_FILE: ${BASTION_ADMIN_PASSWORD_FILE:-}
      BASTION_PASSWORD_MIN_LENGTH: ${BASTION_PASSWORD_MIN_LENGTH:-12}
    configs:
      - source: bastion_config
        target: /etc/zeroterm-bastion/production.toml
    volumes:
      - secrets:/etc/zeroterm-bastion/secrets:ro
      - runtime-auth:/run/bastion-runtime:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  maintenance:
    container_name: ${COMPOSE_PROJECT_NAME}-maintenance
    profiles: [tools]
    image: ${BASTION_IMAGE:-ghcr.io/notpeppa/zeroterm-terminal:latest}
    networks: [app]
    command: ["migrate", "--config", "/etc/zeroterm-bastion/maintenance.toml"]
    environment:
      BASTION_PASSWORD_MIN_LENGTH: ${BASTION_PASSWORD_MIN_LENGTH:-12}
    configs:
      - source: bastion_maintenance_config
        target: /etc/zeroterm-bastion/maintenance.toml
    volumes:
      - secrets:/etc/zeroterm-bastion/secrets
      - database-auth:/run/bastion-db
      - runtime-auth:/run/bastion-runtime
      - recordings:/var/lib/zeroterm-bastion/recordings
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  proxy:
    container_name: ${COMPOSE_PROJECT_NAME}-proxy
    logging: *default-logging
    image: nginx:stable-alpine
    restart: unless-stopped
    networks:
      ingress:
        ipv4_address: 172.30.63.3
    ports:
      - "${BASTION_HTTPS_PORT:-443}:443"
    depends_on:
      bastion:
        condition: service_healthy
        restart: true
    configs:
      - source: nginx_config
        target: /etc/nginx/conf.d/default.conf
    volumes:
      - type: bind
        source: ${BASTION_CONFIG_DIR:-./.local/docker}/tls
        target: /etc/nginx/tls
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--insecure", "--max-time", "3", "https://127.0.0.1/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12

configs:
  bastion_config:
    file: ${BASTION_CONFIG_DIR:-./.local/docker}/production.toml
  bastion_maintenance_config:
    file: ${BASTION_CONFIG_DIR:-./.local/docker}/maintenance.toml
  nginx_config:
    file: ${BASTION_CONFIG_DIR:-./.local/docker}/nginx.conf

networks:
  app:
    ipam:
      config:
        - subnet: 172.30.62.0/24
  guac_bridge:
    internal: true
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.30.61.0/29
  ingress:
    ipam:
      config:
        - subnet: 172.30.63.0/29

volumes:
  database:
  database-auth:
  runtime-auth:
  secrets:
  recordings:
  guacd-netns:
