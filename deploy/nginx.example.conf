# Adapt the hostname and trusted certificate chain before deployment.
server {
    listen 443 ssl;
    server_name bastion.example.invalid;
    ssl_certificate /etc/nginx/tls/bastion-chain.pem;
    ssl_certificate_key /etc/nginx/tls/bastion-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 1g;
    # No access log: websocket handshake headers, tickets and paths must not be logged.
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite, NEVER append to client-supplied forwarding headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Forwarded "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 30s;
    }
    # Metrics is deliberately not proxied onto the public origin.
    location = /metrics { return 404; }
}
