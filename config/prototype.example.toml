# M0 development only. Paths are relative to the process working directory.
# The gateway accepts a single configured asset and an explicit capability set.
server_id = "zeroterm-bastion-development"
api_listen = "127.0.0.1:8080"
ssh_listen = "127.0.0.1:2222"
api_token_file = ".local/api-token"
ssh_host_key_file = ".local/ssh_host_ed25519_key"

[target]
asset_id = "11111111-1111-4111-8111-111111111111"
account_id = "22222222-2222-4222-8222-222222222222"
name = "Development OpenSSH target"
# Literal IP only in M0; target routing never comes from the client.
address = "127.0.0.1:2200"
username = "testuser"
# One independently verified OpenSSH public host key, not a known_hosts file.
host_key_file = ".local/target_host_key.pub"
capabilities = ["shell", "exec", "sftp"]

[target.credentials]
auth = "private_key"
private_key_file = ".local/target_id_ed25519"
# passphrase_file = ".local/target_key_passphrase"
# Password alternative (preserves every byte, including any trailing newline):
# auth = "password"
# password_file = ".local/target_password"
