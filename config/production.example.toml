# RFC-005 browser-only candidate. production_ready remains false.
server_id = "replace-with-stable-server-id"
gateway_id = "main"
api_listen = "172.30.63.2:8080"
public_origin = "https://bastion.example.invalid"
web_root = "/opt/zeroterm-bastion/web/dist"
database_url_file = "/run/bastion-runtime/database-url"
active_kek_version = 1
[kek_files]
"1" = "/etc/zeroterm-bastion/secrets/kek-v1"
[network]
# Deny wins. Narrow allow to actual approved target networks before use.
allow = ["0.0.0.0/0", "::/0"]
deny = ["0.0.0.0/8", "127.0.0.0/8", "169.254.0.0/16", "224.0.0.0/4", "240.0.0.0/4", "100.100.100.200/32", "::/128", "::1/128", "fe80::/10", "ff00::/8", "fd00:ec2::254/128"]
[guacd]
address = "172.30.61.3:4822"
bridge_bind = "172.30.61.2:0"
bridge_advertise_host = "172.30.61.2"
allowed_source_ips = ["172.30.61.3"]
version = "1.6.0"
# Remain fail-closed until this exact engine is independently acceptance-tested.
rdp_strict_pin_verified = false
# VNC is unavailable unless an administrator explicitly trusts specific CIDRs.
vnc_trusted_cidrs = []
[production]
recording_directory = "/var/lib/zeroterm-bastion/recordings"
recording_required = true
retention_days = 30
minimum_free_bytes = 1073741824
metrics_listen = "127.0.0.1:9090"
trusted_proxies = ["172.30.63.3/32"]
[production.limits]
connections_global = 10
connections_per_user = 3
pending_connections = 20
startup_seconds = 45
queue_bytes = 262144
absolute_seconds = 28800
idle_seconds = 1800
stalled_seconds = 30
